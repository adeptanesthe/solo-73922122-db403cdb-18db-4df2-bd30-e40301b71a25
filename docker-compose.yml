services:
  query-expansion:
    build: .
    image: query-expansion-app:1.0
    container_name: query-expansion-app
    ports:
      - "8000:8000"
    volumes:
      # 演示语料随镜像构建生成（镜像内副本为准），不再以宿主机空目录覆盖；
      # 自测报告可从宿主机 reports/ 直接查看。
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
