services:
  query-expansion:
    build: .
    image: query-expansion-app:1.0
    container_name: query-expansion-app
    ports:
      - "8000:8000"
    volumes:
      # 语料与自测报告可从宿主机直接查看；代码以镜像内副本为准
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
